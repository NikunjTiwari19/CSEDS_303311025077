<!DOCTYPE html>
<html>

<head>
    <style>
        .box {
            width: 250px;
            padding: 30px;
            background: lightblue;
            border: 10px solid transparent;
            border-radius: 25px;
            border-image: linear-gradient(red, blue) 1;
        }
    </style>
</head>

<body>
    <h2>Advanced CSS</h2>
    <div class="box">Rounded Corner and Border Image</div>
</body>

</html>
