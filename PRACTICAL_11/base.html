<!DOCTYPE html>
<html>

<body>
    <script>
        let n = 5;
        if (n % 2 == 0)
            document.write("Even Number<br>");
        else
            document.write("Odd Number<br>");

        for (let i = 1; i <= 5; i++)
            document.write(i + " ");

        document.write("<br>");
        let j = 1;
        while (j <= 3) {
            document.write(j + " ");
            j++;
        }
    </script>
</body>

</html>
