<!DOCTYPE html>
<html>

<head>
    <title>Semantic HTML5</title>
</head>

<body>

    <header align="center">
        <h1>MY WEBSITE</h1>
    </header>
    <hr>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <hr>

    <section>
        <main>
            <section>
                <h2>WELCOME TO MY BLOG</h2>
                <p>This is my webpage inside a section</p>
            </section>

            <article>
                <h2>ABOUT US USING ARTICLE TAG</h2>
                <p>We provide useful information.</p>
            </article>

            <aside>
                Related Information using the aside tag....
            </aside>
        </main>

        <footer>
            <p>Copyright &copy; 2026</p>
        </footer>
    </section>

</body>

</html>
