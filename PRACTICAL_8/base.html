<!DOCTYPE html>
<html>

<head>
    <style>
        .float {
            float: left;
            background: lightblue;
            padding: 15px;
        }

        .inline {
            display: inline-block;
            background: lightgreen;
            padding: 15px;
        }

        .flex {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .flex div {
            background: orange;
            padding: 15px;
        }
    </style>
</head>

<body>
    <h3>Float</h3>
    <div class="float">Float Box</div>
    <div style="clear:both"></div>
    <h3>Inline Block</h3>
    <div class="inline">Box 1</div>
    <div class="inline">Box 2</div>
    <h3>Flexbox</h3>
    <div class="flex">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>
</body>

</html>
