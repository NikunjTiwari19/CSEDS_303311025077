<!DOCTYPE html>
<html>

<body>
    <h2 id="heading">Original Text</h2>
    <button onclick="change()">Change Content</button>
    <script>
        function change() {
            let x = document.getElementById("heading");
            x.innerHTML = "Content Changed!";
            x.style.color = "blue";
            x.style.backgroundColor = "lightyellow";
        }
    </script>
</body>

</html>
