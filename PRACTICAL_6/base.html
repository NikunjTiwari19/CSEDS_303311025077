<!-- Use CSS selectors (class, id, pseudo-classes) for styling -->

<!DOCTYPE html>
<html>

<head>
    <style>
        h2 {
            color: blue;
        }

        .box {
            background: lightyellow;
            padding: 15px;
        }
  
        #special {
            color: red;
        }

        a:hover {
            color: green;
        }
    </style>
</head>

<body>
    <h2>CSS Selectors</h2>
    <p class="box">Class Selector</p>
    <p id="special">ID Selector</p>
    <a href="#">Move mouse here</a>
</body>

</html>
