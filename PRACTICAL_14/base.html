<!DOCTYPE html>
<html>

<body>
    <h2>JavaScript Dialog Boxes</h2>
    <button onclick="show()">Start</button>
    <script>
        function show() {
            alert("Welcome!");
            let name = prompt("Enter your name:");
            let choice = confirm("Are you sure?");
            if (choice)
                alert("Hello " + name);
            else
                alert("Cancelled");
        }
    </script>
</body>

</html>
