<!DOCTYPE html>
<html>

<body>
    <h2>JavaScript Functions</h2>
    <script>
        function add(a, b) {
            return a + b;
        }
        function square(n) {
            return n * n;
        }
        document.write("Addition: " + add(10, 20) + "<br>");
        document.write("Square: " + square(5));
    </script>
</body>

</html>
