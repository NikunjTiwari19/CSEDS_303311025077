<!-- Design a webpage using tables and include multimedia elements like audio, video, and iframe.
 -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>TABLE</h1>
    <table border="5" align="center">
        <th>CONTENT</th>
        <tr>
            <td>Video</td>
            <td>
                <video controls>
                    <source src="https://youtu.be/zYUCEZ69nR8">
                </video>
            </td>
        </tr>
        <tr>
            <td>Audio</td>
                <td><audio controls >
                <source src="https://samplelib.com/mp3/sample-3s.mp3">
            </audio></td>
        </tr>
        <tr>
            <td>Iframe</td>
            <td><iframe width="560" height="315" src="https://www.youtube.com/embed/zYUCEZ69nR8?si=xN1Ou-pIuJEGxv2M"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen width="500" height="300"></iframe>
            </td>
        </tr>
    </table>
</body>

</html>
